<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KICE Admin Login</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    font-family: Arial, sans-serif;
}

.login-container {
    width: 90%;
    max-width: 380px;
    padding: 35px 25px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    text-align: center;
}

.login-container h2 {
    margin-bottom: 25px;
    color: #1e3a8a;
}

.login-container input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.login-container button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #1e3a8a;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-container button:hover {
    background: #172554;
}

#error {
    color: red;
    font-size: 14px;
    margin-top: 12px;
}
</style></head><body><div class="login-container"><h2>KICE ADMIN LOGIN</h2>

<input
    type="email"
    id="email"
    placeholder="Email"
    autocomplete="email"
>

<input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
>

<button onclick="login()">LOGIN</button>

<p id="error"></p>

</div><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyCfqCLZ3GahIHPlCKOWfnwpnzy2gqDFd7E",
    authDomain: "kiran-institute-c8099.firebaseapp.com",
    projectId: "kiran-institute-c8099",
    storageBucket: "kiran-institute-c8099.firebasestorage.app",
    messagingSenderId: "286686641576",
    appId: "1:286686641576:web:48e785615a69661b14b19d",
    measurementId: "G-NHKT9SRNC6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function () {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("error");

    errorBox.innerText = "";

    if (!email || !password) {
        errorBox.innerText = "Please enter email and password.";
        return;
    }

    try {

        const userCredential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        console.log("Login successful:", userCredential.user);

        window.location.href = "dashboard.html";

    } catch (error) {

        console.error(error);

        errorBox.innerText =
            "Login failed: " + error.code;
    }
};

</script></body>
</html>
