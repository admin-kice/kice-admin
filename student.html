<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KICE Online Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    .header {
      background: #0b3d91;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 15px;
    }

    .topbar {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .timer {
      background: #d32f2f;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
    }

    .question-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .question-number {
      font-weight: bold;
      color: #0b3d91;
      margin-bottom: 10px;
    }

    .question {
      font-size: 19px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .option {
      display: block;
      border: 1px solid #ccc;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      background: #eef4ff;
    }

    .option input {
      margin-right: 10px;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 10px;
    }

    button {
      border: none;
      padding: 11px 20px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .prev {
      background: #777;
      color: white;
    }

    .next {
      background: #0b3d91;
      color: white;
    }

    .submit {
      background: #198754;
      color: white;
    }

    .palette {
      background: white;
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .palette-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .palette button {
      width: 40px;
      height: 40px;
      padding: 0;
      margin: 4px;
      background: #ddd;
      color: #222;
    }

    .palette button.answered {
      background: #198754;
      color: white;
    }

    .result {
      display: none;
      background: white;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .result h2 {
      color: #198754;
    }

    .score {
      font-size: 30px;
      font-weight: bold;
      margin: 15px 0;
    }

    .restart {
      background: #0b3d91;
      color: white;
      margin-top: 15px;
    }

    @media (max-width: 600px) {
      .question {
        font-size: 17px;
      }

      .header h1 {
        font-size: 20px;
      }

      .navigation button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>KICE ONLINE TEST</h1>
    <p>Competitive Exam Practice Test</p>
  </div>

  <div class="container">

    <div id="testArea">

      <div class="topbar">
        <div>
          <strong>Test:</strong> General Competitive Practice
        </div>

        <div class="timer">
          Time: <span id="timer">20:00</span>
        </div>
      </div>

      <div class="question-box">

        <div class="question-number" id="questionNumber">
          Question 1 of 20
        </div>

        <div class="question" id="questionText"></div>

        <div id="options"></div>

        <div class="navigation">

          <button class="prev" onclick="previousQuestion()">
            Previous
          </button>

          <button class="next" onclick="nextQuestion()">
            Next
          </button>

          <button class="submit" onclick="submitTest()">
            Submit
          </button>

        </div>

      </div>

      <div class="palette">

        <div class="palette-title">
          Question Palette
        </div>

        <div id="palette"></div>

      </div>

    </div>

    <div class="result" id="resultArea">

      <h2>Test Submitted Successfully</h2>

      <div class="score" id="scoreText"></div>

      <p id="correctText"></p>
      <p id="wrongText"></p>
      <p id="unattemptedText"></p>

      <button class="restart" onclick="location.reload()">
        Take Test Again
      </button>

    </div>

  </div>


<script>

const questions = [

  {
    question: "What is the capital of India?",
    options: ["Mumbai", "New Delhi", "Kolkata", "Chennai"],
    answer: 1
  },

  {
    question: "Which is the largest planet in our Solar System?",
    options: ["Earth", "Mars", "Jupiter", "Venus"],
    answer: 2
  },

  {
    question: "Who is known as the Father of the Indian Constitution?",
    options: [
      "Mahatma Gandhi",
      "Dr. B. R. Ambedkar",
      "Jawaharlal Nehru",
      "Sardar Patel"
    ],
    answer: 1
  },

  {
    question: "What is 15 × 8?",
    options: ["100", "110", "120", "130"],
    answer: 2
  },

  {
    question: "Which river is known as the longest river in India?",
    options: ["Yamuna", "Ganga", "Godavari", "Narmada"],
    answer: 1
  },

  {
    question: "Which gas is most abundant in Earth's atmosphere?",
    options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Hydrogen"],
    answer: 2
  },

  {
    question: "If 20% of a number is 50, what is the number?",
    options: ["200", "250", "300", "350"],
    answer: 1
  },

  {
    question: "Who wrote the national anthem of India?",
    options: [
      "Bankim Chandra Chattopadhyay",
      "Rabindranath Tagore",
      "Sarojini Naidu",
      "Subhas Chandra Bose"
    ],
    answer: 1
  },

  {
    question: "Which is the smallest prime number?",
    options: ["0", "1", "2", "3"],
    answer: 2
  },

  {
    question: "Which organ purifies blood in the human body?",
    options: ["Heart", "Lungs", "Kidneys", "Stomach"],
    answer: 2
  },

  {
    question: "What is the square of 25?",
    options: ["525", "625", "725", "825"],
    answer: 1
  },

  {
    question: "Which Indian state has the largest area?",
    options: ["Madhya Pradesh", "Maharashtra", "Rajasthan", "Uttar Pradesh"],
    answer: 2
  },

  {
    question: "Which article of the Indian Constitution deals with equality before law?",
    options: ["Article 12", "Article 14", "Article 16", "Article 21"],
    answer: 1
  },

  {
    question: "What is the HCF of 18 and 24?",
    options: ["3", "6", "9", "12"],
    answer: 1
  },

  {
    question: "Which planet is known as the Red Planet?",
    options: ["Venus", "Mars", "Saturn", "Mercury"],
    answer: 1
  },

  {
    question: "How many fundamental rights are currently guaranteed by the Indian Constitution?",
    options: ["5", "6", "7", "8"],
    answer: 1
  },

  {
    question: "What is 144 ÷ 12?",
    options: ["10", "11", "12", "14"],
    answer: 2
  },

  {
    question: "Which is the largest ocean in the world?",
    options: [
      "Atlantic Ocean",
      "Indian Ocean",
      "Pacific Ocean",
      "Arctic Ocean"
    ],
    answer: 2
  },

  {
    question: "Who was the first President of India?",
    options: [
      "Dr. Rajendra Prasad",
      "Dr. S. Radhakrishnan",
      "Zakir Husain",
      "V. V. Giri"
    ],
    answer: 0
  },

  {
    question: "What is the LCM of 6 and 8?",
    options: ["12", "18", "24", "48"],
    answer: 2
  }

];


let currentQuestion = 0;

let selectedAnswers = new Array(questions.length).fill(null);

let timeLeft = 20 * 60;

let timerInterval;


function loadQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").innerText =
    "Question " + (currentQuestion + 1) +
    " of " + questions.length;

  document.getElementById("questionText").innerText =
    q.question;

  const optionsDiv =
    document.getElementById("options");

  optionsDiv.innerHTML = "";

  q.options.forEach((option, index) => {

    const label = document.createElement("label");

    label.className = "option";

    label.innerHTML = `
      <input
        type="radio"
        name="answer"
        value="${index}"
        ${selectedAnswers[currentQuestion] === index ? "checked" : ""}
      >
      ${option}
    `;

    label.querySelector("input").addEventListener(
      "change",
      function() {
        selectedAnswers[currentQuestion] =
          parseInt(this.value);

        updatePalette();
      }
    );

    optionsDiv.appendChild(label);

  });

  updatePalette();
}


function nextQuestion() {

  if (currentQuestion < questions.length - 1) {

    currentQuestion++;

    loadQuestion();

  }

}


function previousQuestion() {

  if (currentQuestion > 0) {

    currentQuestion--;

    loadQuestion();

  }

}


function goToQuestion(index) {

  currentQuestion = index;

  loadQuestion();

}


function updatePalette() {

  const palette =
    document.getElementById("palette");

  palette.innerHTML = "";

  questions.forEach((q, index) => {

    const button =
      document.createElement("button");

    button.innerText = index + 1;

    if (selectedAnswers[index] !== null) {

      button.classList.add("answered");

    }

    button.onclick = function() {

      goToQuestion(index);

    };

    palette.appendChild(button);

  });

}


function updateTimer() {

  const minutes =
    Math.floor(timeLeft / 60);

  const seconds =
    timeLeft % 60;

  document.getElementById("timer").innerText =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");

  if (timeLeft <= 0) {

    clearInterval(timerInterval);

    submitTest();

    return;

  }

  timeLeft--;

}


function submitTest() {

  const confirmSubmit =
    confirm("Are you sure you want to submit the test?");

  if (!confirmSubmit) {

    return;

  }

  clearInterval(timerInterval);

  let correct = 0;

  let wrong = 0;

  let unattempted = 0;


  questions.forEach((q, index) => {

    if (selectedAnswers[index] === null) {

      unattempted++;

    }

    else if (selectedAnswers[index] === q.answer) {

      correct++;

    }

    else {

      wrong++;

    }

  });


  const score = correct;

  document.getElementById("testArea")
    .style.display = "none";

  document.getElementById("resultArea")
    .style.display = "block";

  document.getElementById("scoreText").innerText =
    "Score: " + score + " / " + questions.length;

  document.getElementById("correctText").innerText =
    "Correct: " + correct;

  document.getElementById("wrongText").innerText =
    "Wrong: " + wrong;

  document.getElementById("unattemptedText").innerText =
    "Unattempted: " + unattempted;

}


loadQuestion();

updateTimer();

timerInterval = setInterval(
  updateTimer,
  1000
);

</script>

</body>
</html>
